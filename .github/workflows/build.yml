name: Compilar Pistas y Descargar audio

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
  schedule:
    # Cada día 1 de mes, a las 05:17 UTC: recompila con la última versión de yt-dlp
    - cron: '17 5 1 * *'

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r engine/requirements.txt
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s tests
        working-directory: engine
      - run: npm ci && npm test
        working-directory: descargador

  compilar:
    needs: pruebas
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, builder: '--win', arch: x64, macarch: '' }
          - { os: macos-15, name: mac-apple-silicon, builder: '--mac --arm64', arch: arm64, macarch: arm64 }
          - { os: macos-15-intel, name: mac-intel, builder: '--mac --x64', arch: x64, macarch: x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r engine/requirements.txt pyinstaller
      - run: npm ci
      - name: Modelos de separación
        run: python scripts/fetch_models.py
      - name: Motor de audio (PyInstaller)
        run: >
          pyinstaller --noconfirm --name rvs-engine --distpath build/engine
          --workpath build/pyi --specpath build/pyi
          --collect-all imageio_ffmpeg --collect-all onnxruntime --collect-all yt_dlp
          --paths engine engine/rvs_engine_entry.py
      - run: npm run build:worklet
      - name: Número de versión
        shell: bash
        run: npm version 0.1.${{ github.run_number }} --no-git-tag-version
      - name: Instalador
        run: npx electron-builder ${{ matrix.builder }} --publish never
      - name: Comprobar que el programa es de la arquitectura correcta
        if: ${{ matrix.macarch != '' }}
        shell: bash
        run: |
          exe=$(find release -path '*.app/Contents/MacOS/*' -type f | head -1)
          echo "$exe"; file "$exe"
          file "$exe" | grep -q "${{ matrix.macarch }}"
          test "$(ls release/*.dmg | wc -l | tr -d ' ')" = "1"
          app=$(find release -maxdepth 2 -name '*.app' | head -1)
          codesign -dv "$app" 2>&1 | head -5
          codesign --verify --deep --strict "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: pistas-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg

  compilar-descargador:
    needs: pruebas
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, builder: '--win', arch: x64, macarch: '' }
          - { os: macos-15, name: mac-apple-silicon, builder: '--mac --arm64', arch: arm64, macarch: arm64 }
          - { os: macos-15-intel, name: mac-intel, builder: '--mac --x64', arch: x64, macarch: x86_64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: descargador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: descargador/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install yt-dlp imageio-ffmpeg numpy onnxruntime pyinstaller
      - run: npm ci
      - name: Modelo de voz (solo ese, para el karaoke)
        shell: bash
        run: python ../scripts/fetch_models.py voces && mkdir -p build/models && cp ../build/models/UVR-MDX-NET-Voc_FT.onnx build/models/
      - name: Motor de descarga y karaoke (PyInstaller)
        run: >
          pyinstaller --noconfirm --name rvs-dl --distpath build/engine
          --workpath build/pyi --specpath build/pyi
          --collect-all imageio_ffmpeg --collect-all yt_dlp --collect-all onnxruntime
          --paths ../engine ../engine/dl_entry.py
      - name: Número de versión
        shell: bash
        run: npm version 0.1.${{ github.run_number }} --no-git-tag-version
      - name: Instalador
        run: npx electron-builder ${{ matrix.builder }} --publish never
      - name: Comprobar que el programa es de la arquitectura correcta
        if: ${{ matrix.macarch != '' }}
        shell: bash
        run: |
          exe=$(find release -path '*.app/Contents/MacOS/*' -type f | head -1)
          echo "$exe"; file "$exe"
          file "$exe" | grep -q "${{ matrix.macarch }}"
          test "$(ls release/*.dmg | wc -l | tr -d ' ')" = "1"
          app=$(find release -maxdepth 2 -name '*.app' | head -1)
          codesign -dv "$app" 2>&1 | head -5
          codesign --verify --deep --strict "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: descargador-${{ matrix.name }}
          path: |
            descargador/release/*.exe
            descargador/release/*.dmg

  publicar:
    if: github.ref == 'refs/heads/main'
    needs: [compilar, compilar-descargador]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: false
      - name: Renombrar con nombres claros
        run: |
          mkdir salida
          for d in instaladores/*; do
            n=$(basename "$d")
            for f in "$d"/*; do
              ext="${f##*.}"
              cp "$f" "salida/${n}.${ext}"
            done
          done
          ls -lh salida
      - name: Qué programa ha cambiado de verdad
        # Cada programa solo avisa de versión nueva si su propio código ha cambiado.
        env:
          GH_TOKEN: ${{ secrets.DESCARGAS_TOKEN }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          PISTAS="$TAG"; DESCARGAR="$TAG"
          PREV=$(gh api repos/rafabueso/rvs-descargas/releases/latest -q .body 2>/dev/null || true)
          P_OLD=$(echo "$PREV" | grep -o 'pistas=v[0-9.]*' | head -1 | cut -d= -f2 || true)
          D_OLD=$(echo "$PREV" | grep -o 'descargar=v[0-9.]*' | head -1 | cut -d= -f2 || true)
          SHA_OLD=$(echo "$PREV" | grep -o 'sha=[0-9a-f]*' | head -1 | cut -d= -f2 || true)
          if [ -n "$SHA_OLD" ] && [ -n "$P_OLD" ] && [ -n "$D_OLD" ] && git cat-file -e "$SHA_OLD^{commit}" 2>/dev/null; then
            git diff --quiet "$SHA_OLD" HEAD -- src engine scripts assets package.json package-lock.json && PISTAS="$P_OLD"
            git diff --quiet "$SHA_OLD" HEAD -- descargador engine scripts/fetch_models.py && DESCARGAR="$D_OLD"
          fi
          echo "NOTES=Instaladores de Pistas y de Descargar audio para Windows y Mac. Cambios: pistas=$PISTAS descargar=$DESCARGAR sha=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "pistas=$PISTAS descargar=$DESCARGAR"
      - name: Crear la versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" salida/* --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --latest \
            --title "Versión $TAG" \
            --notes "$NOTES"
      - name: Copiar a la página pública de descargas
        env:
          GH_TOKEN: ${{ secrets.DESCARGAS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Falta el secreto DESCARGAS_TOKEN: no se publica en rvs-descargas."
            exit 0
          fi
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" salida/* --repo rafabueso/rvs-descargas --latest \
            --title "Versión $TAG" \
            --notes "$NOTES"
# Publicación pública activada (secreto DESCARGAS_TOKEN)
